<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель | Кофейня AROMA</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="site-header">
        <h1>☕ Кофейня AROMA · Админ</h1>
        <nav id="main-nav">
            <a href="index.html">Меню</a>
            <a href="blog.html">Блог</a>
            <a href="admin.html" id="nav-admin">Админ</a>
            <span id="nav-user"></span>
            <a href="login.html" id="nav-login">Войти</a>
            <a href="#" id="nav-logout">Выйти</a>
        </nav>
    </header>
    <main class="page-container">
        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="stats">📊 Статистика</button>
            <button class="admin-tab" data-tab="products">📦 Товары</button>
            <button class="admin-tab" data-tab="blog">📝 Блог</button>
            <button class="admin-tab" data-tab="orders">🧾 Заказы</button>
        </div>

        <section id="tab-stats" class="admin-section">
            <div class="stats-cards" id="stats-cards"></div>
            <div class="chart-row">
                <div class="chart-box"><canvas id="sales-chart"></canvas></div>
                <div class="chart-box"><canvas id="top-chart"></canvas></div>
            </div>
        </section>

        <section id="tab-products" class="admin-section" style="display:none">
            <h3>Товары</h3>
            <form id="product-form" class="admin-form">
                <input type="hidden" name="id">
                <input name="title" placeholder="Название" required>
                <input name="category" placeholder="Категория" required>
                <input name="price" type="number" step="0.01" placeholder="Цена" required>
                <input name="imageUrl" placeholder="URL картинки">
                <input name="description" placeholder="Описание">
                <label><input type="checkbox" name="isActive" checked> Активен</label>
                <button type="submit">Сохранить</button>
                <button type="button" id="reset-product">Отмена</button>
            </form>
            <table class="admin-table" id="products-table">
                <thead><tr><th>ID</th><th>Название</th><th>Категория</th><th>Цена</th><th>Активен</th><th></th></tr></thead>
                <tbody></tbody>
            </table>
        </section>

        <section id="tab-blog" class="admin-section" style="display:none">
            <h3>Публикации блога</h3>
            <form id="blog-form" class="admin-form">
                <input type="hidden" name="id">
                <input name="title" placeholder="Заголовок" required>
                <input name="imageUrl" placeholder="URL картинки">
                <textarea name="content" placeholder="Содержание" rows="4" required></textarea>
                <button type="submit">Сохранить</button>
                <button type="button" id="reset-blog">Отмена</button>
            </form>
            <table class="admin-table" id="blog-table">
                <thead><tr><th>ID</th><th>Заголовок</th><th>Автор</th><th>Дата</th><th></th></tr></thead>
                <tbody></tbody>
            </table>
        </section>
         <button class="admin-tab" data-tab="users">👥 Пользователи</button>

        <section id="tab-orders" class="admin-section" style="display:none">
            <h3>Заказы</h3>
            <table class="admin-table" id="orders-table">
                <thead><tr><th>№</th><th>Чек</th><th>Дата</th><th>Сумма</th><th>Статус</th><th>Пожелания</th><th></th></tr></thead>
                <tbody></tbody>
            </table>
        </section>
                <section id="tab-users" class="admin-section" style="display:none">
            <h3>Пользователи</h3>
            <table class="admin-table" id="users-table">
                <thead><tr><th>ID</th><th>Имя</th><th>Email</th><th>Роль</th><th>Дата рег.</th></tr></thead>
                <tbody></tbody>
            </table>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
