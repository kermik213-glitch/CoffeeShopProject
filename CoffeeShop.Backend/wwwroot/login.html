<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход | Кофейня AROMA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <h1>☕ Кофейня AROMA</h1>
        <nav id="main-nav">
            <a href="index.html">Меню</a>
            <a href="blog.html">Блог</a>
            <a href="admin.html" id="nav-admin" style="display:none">Админ</a>
            <span id="nav-user"></span>
            <a href="login.html" id="nav-login">Войти</a>
            <a href="#" id="nav-logout" style="display:none">Выйти</a>
        </nav>
    </header>
    <main class="auth-container">
        <div class="auth-tabs">
            <button class="tab active" data-tab="login">Вход</button>
            <button class="tab" data-tab="register">Регистрация</button>
        </div>
        <form id="login-form" class="auth-form">
            <h2>Вход</h2>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
            <p class="hint">Админ по умолчанию: admin@coffee.ru / admin123</p>
        </form>
        <form id="register-form" class="auth-form" style="display:none">
            <h2>Регистрация</h2>
            <input type="text" name="name" placeholder="Имя" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Пароль" minlength="6" required>
            <button type="submit">Зарегистрироваться</button>
        </form>
        <p id="auth-error" class="error"></p>
    </main>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
